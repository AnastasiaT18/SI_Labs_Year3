[env:megaatmega2560]
; [env:uno]

platform = atmelavr
board = megaatmega2560
; board = uno
framework = arduino
lib_deps = 
	chris--a/Keypad@^3.1.1
	sadr0b0t/arduino-timer-api@^0.1.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	feilipu/FreeRTOS@^10.4.6
	paulstoffregen/OneWire
	milesburton/DallasTemperature
	adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14


; build_flags = -D RUN_LAB4   ; ← run lab 4
; build_flags = -D RUN_LAB3   ; ← run lab 3
; build_flags = -D RUN_LAB5  ; ← run lab 3
build_flags = -D RUN_LAB6  ; ← run lab 6


